name: Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  OTELCOL_VERSION: "0.161.0"
  ALPINE_VERSION: "alpine3.24"

jobs:
  docker_build_push:
    name: OtelCol Build and push Docker image
    uses: elastiflow/gha-reusable/.github/workflows/reusable_docker_build_multiarch.yaml@v0.8.0
    permissions:
      contents: read
      packages: write
      artifact-metadata: write
      attestations: write
      id-token: write
    with:
      matrix_runner: '["ubuntu-26.04", "ubuntu-26.04-arm"]'
      matrix_target: '["runner"]'
      runner_platform_map: |
        {
          "ubuntu-26.04": "linux/amd64",
          "ubuntu-26.04-arm": "linux/arm64"
        }
      dockerfile: cmd/otelcontribcol/Dockerfile
      version: "0.161.0-alpine3.24"
      cache_storage: "foobar"
      cache_from: type=gha
      cache_to: type=gha,mode=max
      ghcr_push: true
      ghcr_image: ${{ github.repository }}
